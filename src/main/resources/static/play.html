<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/controls.css">
    <link rel="stylesheet" href="./css/board.css">
    <link rel="stylesheet" href="./css/overlay.css">
    <link rel="stylesheet" href="./css/board.css">
    <link rel="stylesheet" href="./css/overlay.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Matemasie&family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <a class="navbar-brand-link" href="./index.html" aria-label="Go to home page">
                <span class="navbar-title">Chess</span>
            </a>
        </div>

        <ul class="navbar-links" id="navbar-links">
            <li><a href="./play.html" class="navbar-link active">Play</a></li>
            <li><a href="#" class="navbar-link">Stats</a></li>
            <li><a href="#" class="navbar-link">Settings</a></li>
        </ul>

        <button class="navbar-menu-button" id="navbar-menu-button" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="navbar-links">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <button class="navbar-profile" title="Profile" aria-label="Profile">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5.52 19c.64-2.2 1.84-3 3.22-3h6.52c1.38 0 2.58.8 3.22 3"/>
                <circle cx="12" cy="10" r="3"/>
                <circle cx="12" cy="12" r="10"/>
            </svg>
        </button>
    </nav>

    <div class="game-mode">
        <div>
            <button id="play-bot-button" class="btn btn-primary">Play against Bot</button>
        </div>
        <div>
            <button id="play-human-button" class="btn btn-primary">Play against Human</button>
        </div>
    </div>

    <div class="game-layout game-board-screen">
        <div class="right-panel">
            <div class="player-content">
                <div class="profile">
                    <div id="player1-avatar" class="profile-avatar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="bi bi-robot" viewBox="0 0 16 16">
                            <path d="M6 12.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5M3 8.062C3 6.76 4.235 5.765 5.53 5.886a26.6 26.6 0 0 0 4.94 0C11.765 5.765 13 6.76 13 8.062v1.157a.93.93 0 0 1-.765.935c-.845.147-2.34.346-4.235.346s-3.39-.2-4.235-.346A.93.93 0 0 1 3 9.219zm4.542-.827a.25.25 0 0 0-.217.068l-.92.9a25 25 0 0 1-1.871-.183.25.25 0 0 0-.068.495c.55.076 1.232.149 2.02.193a.25.25 0 0 0 .189-.071l.754-.736.847 1.71a.25.25 0 0 0 .404.062l.932-.97a25 25 0 0 0 1.922-.188.25.25 0 0 0-.068-.495c-.538.074-1.207.145-1.98.189a.25.25 0 0 0-.166.076l-.754.785-.842-1.7a.25.25 0 0 0-.182-.135"/>
                            <path d="M8.5 1.866a1 1 0 1 0-1 0V3h-2A4.5 4.5 0 0 0 1 7.5V8a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1v1a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1v-.5A4.5 4.5 0 0 0 10.5 3h-2zM14 7.5V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7.5A3.5 3.5 0 0 1 5.5 4h5A3.5 3.5 0 0 1 14 7.5"/>
                        </svg>
                    </div>
                    <div class="profile-info">
                        <span id="player1-name" class="profile-name">Player 1</span>
                        <span class="profile-rating">1200</span>
                    </div>
                </div> 
                <div class="clock">
                    <span id="clock1" class="clock-time">00:00</span>
                </div>
            </div>
            <div class="grid-board"></div>
            <div class="player-content">
                <div class="profile">
                <div id="player2-avatar" class="profile-avatar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="bi bi-person-fill" viewBox="0 0 16 16">
                        <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
                    </svg>
                </div>
                <div class="profile-info">
                    <span id="player2-name" class="profile-name">Player 2</span>
                    <span class="profile-rating">1200</span>
                </div>
                </div>
                <div class="clock">
                    <span id="clock2" class="clock-time">00:00</span>
                </div>
            </div>
            
        </div>
    </div>

    <div id="game-over-overlay" class="game-over-overlay" aria-live="polite" aria-atomic="true">
        <div class="game-over-card">
            <h2 id="game-over-title">Game Over</h2>
            <p id="game-over-detail"></p>
            <button id="play-again-button" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
